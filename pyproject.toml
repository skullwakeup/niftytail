[project]
name = "niftytail"
version = "0.1.0"
description = "Extreme downside risk estimation in the Nifty 50 using extreme value theory (research code)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sambit Sinha" }
]
requires-python = ">=3.13,<3.14"
# pandas<3, statsmodels<0.15 and mypy<2: the newer compiled wheels are blocked by Windows Smart App Control on the development machine (ENV-1); these older wheels load (decision D24). No methodology depends on these versions.
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=2.3.3,<3",
    "scipy>=1.18.1",
    "statsmodels>=0.14.6,<0.15",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Windows Application Control blocks uv-managed interpreters on the development
# machine (os error 4551); use the installed system Python 3.13 instead.
python-preference = "only-system"

[dependency-groups]
dashboard = [
    "streamlit>=1.67.0",
    # pyarrow below the newest release: Smart App Control blocks the newest pyarrow DLLs on the development machine (ENV-1); this older wheel loads (D56). Streamlit 1.67 allows pyarrow>=12,<27.
    "pyarrow>=24.0.0,<25",
]
dev = [
    "mypy>=1.20.2,<2",
    "pandas-stubs>=2.3,<3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# frozen approved plan; its SHA-256 is pinned by tests/test_repo_hygiene.py
extend-exclude = ["docs/plan_v2.2.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
# Narrow override (scipy only, never global): scipy ships no type stubs, and scipy-stubs
# was not added to avoid a lockfile change. Revisit scipy-stubs at Day 5.
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["slow: long-running statistical tests (deselect with -m 'not slow')"]
xfail_strict = true

[tool.coverage.run]
source = ["niftytail"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
